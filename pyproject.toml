[project]
name = "ptb-xl-ecg-classification"
version = "0.1.0"
description = "ECG signal classification using the PTB-XL dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "joblib>=1.5.2",
    "scipy>=1.16.0",
    "scikit-learn>=1.7.2,<1.8.0",
    "tqdm>=4.70.1",
    "wfdb>=4.3.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
